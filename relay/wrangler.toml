name = "starling"
main = "src/index.js"
compatibility_date = "2026-08-01"

# The canonical origin. Binding the apex to the Worker auto-creates the DNS
# record and provisions the TLS cert. The workers.dev URL keeps working too.
[[routes]]
pattern = "starlingmap.app"
custom_domain = true

[assets]
directory = "../app"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
RATE_POST_MIN = "60"
RATE_GET_MIN = "240"

[[d1_databases]]
binding = "DB"
database_name = "starling"
database_id = "acca9e46-0fa4-400e-8e79-830c111ece87"
