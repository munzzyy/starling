name = "starling"
main = "src/index.js"
compatibility_date = "2026-08-01"

[assets]
directory = "../app"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
RATE_POST_MIN = "60"
RATE_GET_MIN = "240"

[[d1_databases]]
binding = "DB"
database_name = "starling"
database_id = "REPLACE-ON-DEPLOY"
